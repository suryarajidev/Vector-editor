<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small first test for downloading SVG artwork from Vector Editor."
    />
    <title>Vector Editor — SVG download test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="download-card" aria-labelledby="page-title">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M13 34 24 10l11 24-11-5-11 5Z" />
            <circle cx="24" cy="23" r="3.5" />
          </svg>
        </div>

        <p class="eyebrow">Vector Editor · first experiment</p>
        <h1 id="page-title">Let’s make sure SVG downloads work.</h1>
        <p class="intro">
          Press the button and your browser will save a small piece of surprise
          vector artwork. No libraries or server required.
        </p>

        <button class="download-button" id="download-svg" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" />
          </svg>
          Download a surprise SVG
        </button>

        <p class="status" id="download-status" aria-live="polite">
          The downloaded artwork will have a transparent background.
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
